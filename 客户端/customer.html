
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>扫码点单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1613;
    --bg-soft:#221B17;
    --card:#2A2119;
    --card-line:#3D332B;
    --ember:#E3421F;
    --ember-dark:#B22F14;
    --gold:#E8A23D;
    --text:#F3ECE1;
    --text-muted:#AFA396;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{width:100%;max-width:480px;min-height:100vh;position:relative;padding-bottom:110px;}
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--gold);
    text-transform:uppercase;font-weight:700;
  }
  /* ---------- table picker (test mode) ---------- */
  .pick-screen{padding:64px 24px;text-align:center;}
  .pick-screen h1{
    font-family:'Archivo Black',sans-serif;
    font-size:28px;margin:14px 0 6px;
  }
  .pick-hint{color:var(--text-muted);font-size:14px;margin-bottom:32px;}
  .table-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .table-grid button{
    aspect-ratio:1;border-radius:14px;border:1px solid var(--card-line);
    background:var(--card);color:var(--text);font-size:20px;font-weight:700;
    font-family:'Archivo Black',sans-serif;cursor:pointer;
  }
  .table-grid button:hover{border-color:var(--ember);color:var(--ember);}
  .table-grid button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- header ---------- */
  header.bar{
    padding:28px 24px 18px;border-bottom:1px solid var(--card-line);
  }
  .table-badge{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .table-badge .num{
    font-family:'Archivo Black',sans-serif;
    font-size:34px;color:var(--ember);line-height:1;
  }
  .change-table{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;
    margin-top:6px;
  }
  .change-table:hover{color:var(--text);border-color:var(--text-muted);}

  /* ---------- panda nav (fixed, shown on every screen once a table is known) ---------- */
  #panda-nav{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;}
  .panda-overlay{position:fixed;inset:0;z-index:55;background:none;border:none;padding:0;margin:0;cursor:default;}
  .my-order-btn{
    position:relative;z-index:56;
    display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
    padding:0;font-family:inherit;color:var(--text);
  }
  .panda-avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:var(--card);border:1px solid var(--card-line);
    display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;
  }
  .my-order-btn:hover .panda-avatar{border-color:var(--ember);}
  .my-order-label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .my-order-btn:hover .my-order-label{color:var(--text);}
  .panda-dropdown{
    position:relative;z-index:56;margin-top:8px;min-width:136px;
    background:var(--card);border:1px solid var(--card-line);border-radius:12px;
    overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4);
  }
  .panda-dropdown button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:13.5px;font-weight:700;padding:12px 16px;cursor:pointer;font-family:inherit;
  }
  .panda-dropdown button+button{border-top:1px solid var(--card-line);}
  .panda-dropdown button:hover{background:var(--bg-soft);color:var(--ember);}

  /* ---------- menu ---------- */
  .menu-title{padding:22px 24px 10px;font-size:15px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;}
  .menu-body{display:flex;align-items:flex-start;}
  .category-nav{
    width:84px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--card-line);
  }
  .cat-btn{
    background:none;border:none;border-left:3px solid transparent;color:var(--text-muted);
    font-size:13px;font-weight:700;padding:14px 6px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.3;
  }
  .cat-btn.active{color:var(--text);background:var(--bg-soft);border-left-color:var(--ember);}
  .cat-btn:hover{color:var(--text);}
  .dish-panel{flex:1;min-width:0;padding-right:16px;}
  .dish-list{padding:0 0 0 16px;display:flex;flex-direction:column;gap:14px;}
  .dish-card{
    background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .dish-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .dish-head h3{
    font-size:20px;font-weight:900;letter-spacing:.02em;
  }
  .dish-head .tag{font-size:12.5px;color:var(--text-muted);margin-top:5px;}
  .stepper{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .stepper button{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper button:not(:disabled):hover{border-color:var(--ember);color:var(--ember);}
  .stepper .qty{
    width:30px;text-align:center;font-weight:700;font-size:16px;
    font-family:'Archivo Black',sans-serif;
  }
  .spice-row{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--card-line);}
  .spice-pill{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 6px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:12.5px;cursor:pointer;
  }
  .spice-pill.active{border-color:var(--ember);color:var(--ember);background:rgba(227,66,31,.12);}
  .flame{fill:var(--card-line);}
  .spice-pill.active .flame.lit{fill:var(--ember);}
  .spice-pill:not(.active) .flame.lit{fill:var(--text-muted);}

  /* ---------- sticky bottom bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
    background:linear-gradient(180deg,rgba(27,22,19,0) 0%,var(--bg) 30%);
    padding:20px 16px 24px;
  }
  .bottom-bar-inner{
    width:100%;max-width:448px;display:flex;align-items:stretch;gap:12px;
  }
  .submit-btn{
    flex:1;background:var(--ember);color:#fff;border:none;border-radius:14px;
    padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
  }
  .submit-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;}
  .submit-btn:not(:disabled):active{background:var(--ember-dark);}

  .cart-btn{
    flex:1;background:#2E9E5B;color:#fff;border:none;border-radius:14px;
    padding:12px 14px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-align:center;
  }
  .cart-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;}
  .cart-btn:not(:disabled):active{background:#257C48;}
  .cart-btn-title{font-size:23px;font-weight:900;}
  .cart-btn-sub{font-size:11.5px;font-weight:500;opacity:.85;}

  .order-now-btn{
    width:92px;aspect-ratio:1;flex-shrink:0;background:var(--ember);color:#fff;border:none;
    border-radius:14px;cursor:pointer;font-family:inherit;padding:0 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;
  }
  .order-now-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;}
  .order-now-btn:not(:disabled):active{background:var(--ember-dark);}
  .order-now-title{font-size:17px;font-weight:900;}
  .order-now-sub{font-size:9.5px;font-weight:500;opacity:.85;}

  /* ---------- add-to-cart dumpling/hotpot animation ---------- */
  .hotpot-toast{
    position:fixed;left:50%;bottom:148px;z-index:80;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    animation:hotpot-toast-life 1.7s ease forwards;
  }
  @keyframes hotpot-toast-life{
    0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9);}
    10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    82%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96);}
  }
  .hotpot-pot{position:relative;width:112px;height:84px;}
  .hotpot-pot svg{position:absolute;left:0;top:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
  .hotpot-dumpling{
    position:absolute;left:50%;top:50%;font-size:26px;line-height:1;
    transform:translate(-50%,-120px) rotate(-25deg);
    animation:dumpling-drop .55s cubic-bezier(.55,0,.85,.6) .3s forwards;
  }
  @keyframes dumpling-drop{
    0%{transform:translate(-50%,-120px) rotate(-25deg);opacity:1;}
    85%{transform:translate(-50%,-14px) rotate(20deg);opacity:1;}
    100%{transform:translate(-50%,-10px) rotate(15deg) scale(.92);opacity:1;}
  }
  .hotpot-splash{
    position:absolute;left:50%;top:36%;font-size:20px;
    transform:translate(-50%,-50%) scale(.2);opacity:0;
    animation:hotpot-splash .45s ease-out .82s forwards;
  }
  @keyframes hotpot-splash{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
    35%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}
    100%{transform:translate(-50%,-60%) scale(1.6);opacity:0;}
  }
  .hotpot-steam{
    position:absolute;color:rgba(255,255,255,.55);font-size:16px;font-weight:700;opacity:0;
    animation:hotpot-steam-rise 1.6s ease-in-out infinite;
  }
  .hotpot-steam.s1{left:36%;top:4px;animation-delay:0s;}
  .hotpot-steam.s2{left:58%;top:0;animation-delay:.5s;}
  @keyframes hotpot-steam-rise{
    0%{opacity:0;transform:translateY(4px) scale(.8);}
    30%{opacity:.8;}
    100%{opacity:0;transform:translateY(-22px) scale(1.15);}
  }
  .hotpot-caption{
    background:var(--card);border:1px solid var(--card-line);color:var(--text);
    font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:20px;
    opacity:0;animation:hotpot-caption-in .4s ease .9s forwards;
  }
  @keyframes hotpot-caption-in{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* ---------- confirm screen ---------- */
  .confirm-screen{padding:56px 28px 40px;text-align:center;}
  .stamp-ring{
    width:132px;height:132px;margin:0 auto 26px;border-radius:50%;
    border:3px solid var(--ember);display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);position:relative;
  }
  .stamp-ring::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--ember);border-radius:50%;
  }
  .stamp-ring span{
    font-family:'Archivo Black',sans-serif;color:var(--ember);font-size:19px;letter-spacing:.05em;
  }
  @media (prefers-reduced-motion:no-preference){
    .stamp-ring{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  }
  @keyframes pop{from{transform:rotate(-8deg) scale(.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .confirm-screen h2{font-family:'Archivo Black',sans-serif;font-size:24px;color:var(--ember);margin-bottom:22px;}
  .order-summary{list-style:none;text-align:left;background:var(--card);border:1px solid var(--card-line);
    border-radius:var(--radius);padding:6px 18px;margin-bottom:20px;}
  .order-summary li{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;font-size:15px;
  }
  .order-summary li + li{border-top:1px dashed var(--card-line);}
  .spice-tag{font-size:11.5px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:2px 9px;}
  .hint{color:var(--text-muted);font-size:13.5px;margin-bottom:26px;}
  .ghost-btn{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    padding:11px 22px;border-radius:12px;font-size:14px;cursor:pointer;
  }
  .ghost-btn:hover{color:var(--text);border-color:var(--text-muted);}

  .back-row{text-align:left;padding:14px 24px 0;}
  .back-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;cursor:pointer;padding:6px 2px;
    font-family:inherit;
  }
  .back-btn:hover{color:var(--text);}

  .my-order-card{
    margin-top:32px;text-align:left;
    background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .my-order-title{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);}
  .my-order-card .order-summary{
    margin:12px 0 0;background:none;border:none;padding:0;
  }
  .my-order-card .order-summary li{padding:11px 0;}
  .my-order-card .order-summary li + li{border-top:1px dashed var(--card-line);}
  .my-order-note{font-size:12.5px;color:var(--gold);margin:14px 0 0;}
  .text-link-btn{
    background:none;border:none;color:var(--ember);font-weight:700;font-size:14px;
    cursor:pointer;padding:14px 0 0;font-family:inherit;display:block;
  }
  .text-link-btn:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>
<div id="panda-nav"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: 'AIzaSyBUFdqFcmnmGyuS1-ZWq7bEv0fUxTNNAFU',
  authDomain: 'ddxt-bc353.firebaseapp.com',
  projectId: 'ddxt-bc353',
  storageBucket: 'ddxt-bc353.firebasestorage.app',
  messagingSenderId: '624541373179',
  appId: '1:624541373179:web:72e5f44322ad337406165e',
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ordersRef = db.collection('orders');

const MENU = [
  { id:'dachang', name:'爆炒大肠', tag:'猛火爆炒，外脆里嫩', category:'招牌菜' },
  { id:'zhangyi', name:'油炸张毅', tag:'现炸现装，外酥里嫩', category:'招牌菜' },
  { id:'wangdianzhang', name:'清蒸王店长', tag:'原汁原味，清淡鲜香', category:'招牌菜' },
  { id:'zhaoshifu', name:'干煸赵师傅', tag:'干煸入味，越嚼越香', category:'招牌菜' },
  { id:'chaofan',  name:'狂炒米饭', tag:'锅气拉满，粒粒分明', category:'主食' },
  { id:'mixian',   name:'狠炒米线', tag:'劲道爽滑，越吃越上头', category:'主食' },
];
const CATEGORIES = ['全部', ...Array.from(new Set(MENU.map(d=>d.category)))];
const SPICE_LEVELS = ['微辣','中辣','特辣'];

const params = new URLSearchParams(location.search);
const urlTable = params.get('table');

let state = {
  table: urlTable || null,
  lockedByUrl: !!urlTable,
  screen: urlTable ? 'menu' : 'pick',
  items: {},   // { dishId: { qty, spice } }
  activeCategory: '全部',
  lastOrder: null,
  submitting: false,
  myOrderItems: null,
  myOrderLoading: false,
  pandaMenuOpen: false,
};

let screenHistory = [];   // 记录来源页面，供“返回”按钮回退用

function goBack(){
  const prev = screenHistory.pop();
  if(!prev) return;
  state.screen = prev;
  render();
}

function backRowHTML(){
  if(screenHistory.length === 0) return '';
  return `<div class="back-row"><button class="back-btn" onclick="goBack()" aria-label="返回上一页">← 返回</button></div>`;
}

function getItem(id){
  return state.items[id] || { qty:0, spice:'中辣' };
}

function changeQty(id, delta){
  const cur = getItem(id);
  const qty = Math.max(0, Math.min(20, cur.qty + delta));
  state.items[id] = { qty, spice: cur.spice };
  render();
}

function setSpice(id, level){
  const cur = getItem(id);
  if(cur.qty <= 0) return;
  state.items[id] = { qty: cur.qty, spice: level };
  render();
}

function setCategory(cat){
  state.activeCategory = cat;
  render();
}

async function goToMyOrder(){
  state.pandaMenuOpen = false;
  if(state.screen !== 'myOrder') screenHistory.push(state.screen);
  state.screen = 'myOrder';
  state.myOrderLoading = true;
  state.myOrderItems = null;
  render();

  const orders = await fetchTableOrders(state.table);
  state.myOrderItems = mergeItems(orders);
  state.myOrderLoading = false;
  render();
}

function celebrateAddToCart(){
  const existing = document.querySelector('.hotpot-toast');
  if(existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'hotpot-toast';
  toast.innerHTML = `
    <div class="hotpot-pot">
      <svg viewBox="0 0 120 90" width="112" height="84">
        <path d="M10 32 Q10 80 60 80 Q110 80 110 32 L100 32 Q100 70 60 70 Q20 70 20 32 Z" fill="#8A2A12"/>
        <ellipse cx="60" cy="32" rx="50" ry="13" fill="#E3421F"/>
        <ellipse cx="60" cy="32" rx="50" ry="13" fill="none" stroke="#7A2A14" stroke-width="2.5"/>
        <ellipse cx="60" cy="32" rx="42" ry="9" fill="#B22F14"/>
        <rect x="-2" y="27" width="16" height="8" rx="4" fill="#8A2A12"/>
        <rect x="106" y="27" width="16" height="8" rx="4" fill="#8A2A12"/>
      </svg>
      <span class="hotpot-steam s1">~</span>
      <span class="hotpot-steam s2">~</span>
      <span class="hotpot-dumpling">🥟</span>
      <span class="hotpot-splash">💦</span>
    </div>
    <p class="hotpot-caption">已加入购物车！</p>
  `;
  document.body.appendChild(toast);
  toast.addEventListener('animationend', (ev)=>{
    if(ev.target === toast) toast.remove();
  });
}

function goToCart(){
  state.pandaMenuOpen = false;
  if(state.screen !== 'cart') screenHistory.push(state.screen);
  state.screen = 'cart';
  render();
}

function togglePandaMenu(){
  state.pandaMenuOpen = !state.pandaMenuOpen;
  render();
}

function closePandaMenu(){
  if(!state.pandaMenuOpen) return;
  state.pandaMenuOpen = false;
  render();
}

function selectTable(n){
  screenHistory.push(state.screen);
  state.table = String(n);
  state.screen = 'menu';
  render();
}

function changeTable(){
  if(state.lockedByUrl) return;
  screenHistory = [];
  state.screen = 'pick';
  render();
}

function totalCount(){
  return Object.values(state.items).reduce((s,v)=>s+v.qty,0);
}

function resetToMenu(){
  state.items = {};
  state.lastOrder = null;
  screenHistory = [];
  state.screen = 'menu';
  render();
}

async function fetchTableOrders(table){
  try{
    const snap = await ordersRef.where('table', '==', String(table)).get();
    return snap.docs.map(d => d.data());
  }catch(e){ return []; }
}

// 同一桌可能有多笔未处理订单（加菜），按“菜名+辣度”合并数量，方便顾客看到本桌目前的点单全貌
function mergeItems(ordersList){
  const merged = new Map();
  ordersList.forEach(o => {
    o.items.forEach(it => {
      const key = it.name + '__' + it.spice;
      if(!merged.has(key)) merged.set(key, { name: it.name, spice: it.spice, qty: 0 });
      merged.get(key).qty += it.qty;
    });
  });
  return Array.from(merged.values());
}

async function submitOrder(){
  if(state.submitting || totalCount() === 0) return;
  state.submitting = true; render();

  const items = MENU
    .map(d => ({ name: d.name, ...getItem(d.id) }))
    .filter(it => it.qty > 0)
    .map(it => ({ name: it.name, qty: it.qty, spice: it.spice }));

  const order = { table: state.table, items, createdAt: Date.now() };

  try{
    const priorOrders = await fetchTableOrders(state.table);
    const isAddOn = priorOrders.length > 0;

    await ordersRef.add({
      table: order.table,
      items: order.items,
      createdAt: order.createdAt,
    });

    const tableOrders = await fetchTableOrders(state.table);
    const summaryItems = mergeItems(tableOrders.length > 0 ? tableOrders : [...priorOrders, order]);

    state.lastOrder = { table: order.table, items: order.items, summaryItems, isAddOn };
    screenHistory.push('menu');
    state.screen = 'confirm';
  }catch(e){
    alert('下单失败，请重试一次，或直接告诉服务员～');
  }
  state.submitting = false;
  render();
}

function flameIcons(n){
  let out = '';
  for(let i=0;i<3;i++){
    out += `<svg class="flame ${i<n?'lit':''}" viewBox="0 0 24 24" width="11" height="11">
      <path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-5 5-9z"/>
    </svg>`;
  }
  return out;
}

function tablePickHTML(){
  return `
    <div class="pick-screen">
      <p class="eyebrow">测试模式</p>
      <h1>请选择桌号</h1>
      <p class="pick-hint">正式部署后，扫桌上二维码会自动带入桌号</p>
      <div class="table-grid">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="selectTable(${n})">桌 ${n}</button>`).join('')}
      </div>
    </div>`;
}

function menuHTML(){
  const activeCat = state.activeCategory || '全部';
  const filteredMenu = activeCat === '全部' ? MENU : MENU.filter(d=>d.category===activeCat);

  const dishesHTML = filteredMenu.map(d=>{
    const it = getItem(d.id);
    return `
      <div class="dish-card">
        <div class="dish-head">
          <div>
            <h3>${d.name}</h3>
            <p class="tag">${d.tag}</p>
          </div>
          <div class="stepper">
            <button onclick="changeQty('${d.id}',-1)" ${it.qty<=0?'disabled':''} aria-label="减少数量">−</button>
            <span class="qty">${it.qty}</span>
            <button onclick="changeQty('${d.id}',1)" aria-label="增加数量">+</button>
          </div>
        </div>
        ${it.qty>0 ? `
          <div class="spice-row">
            ${SPICE_LEVELS.map((lvl,i)=>`
              <button class="spice-pill ${it.spice===lvl?'active':''}" onclick="setSpice('${d.id}','${lvl}')">
                ${flameIcons(i+1)}<span>${lvl}</span>
              </button>`).join('')}
          </div>` : ''}
      </div>`;
  }).join('');

  const categoryNavHTML = CATEGORIES.map(cat=>`
    <button class="cat-btn ${activeCat===cat?'active':''}" onclick="setCategory('${cat}')">${cat}</button>
  `).join('');

  const count = totalCount();

  return `
    ${backRowHTML()}
    <header class="bar">
      <div class="table-badge">
        <span class="eyebrow">桌号</span>
        <span class="num">${state.table}</span>
        ${!state.lockedByUrl ? `<button class="change-table" onclick="changeTable()">切换桌号</button>` : ''}
      </div>
    </header>
    <p class="menu-title">菜单</p>
    <div class="menu-body">
      <nav class="category-nav">${categoryNavHTML}</nav>
      <div class="dish-panel">
        <div class="dish-list">${dishesHTML}</div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="cart-btn" onclick="celebrateAddToCart()" ${count===0?'disabled':''}>
          <span class="cart-btn-title">加入购物车</span>
          <span class="cart-btn-sub">小纠结？先丢进购物车！</span>
        </button>
        <button class="order-now-btn" onclick="submitOrder()" ${count===0||state.submitting?'disabled':''}>
          <span class="order-now-title">${state.submitting?'下单中…':'立即下单'}</span>
          <span class="order-now-sub">不再犹豫！</span>
        </button>
      </div>
    </div>`;
}

function myOrderHTML(){
  const items = state.myOrderItems || [];
  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">桌号 ${state.table}</p>
      <h2 style="margin-top:6px;">我的订单</h2>
      ${state.myOrderLoading
        ? `<p class="hint">加载中…</p>`
        : items.length === 0
          ? `<p class="hint">还没有点菜，去菜单看看吧～</p>`
          : `<ul class="order-summary">
              ${items.map(it=>`<li>${it.name} × ${it.qty}<span class="spice-tag">${it.spice}</span></li>`).join('')}
            </ul>
            <p class="hint">如需退菜，请联系服务员哦～</p>`
      }
      <button class="ghost-btn" onclick="goBack()">返回菜单</button>
    </div>`;
}

function cartHTML(){
  const items = MENU
    .map(d => ({ id: d.id, name: d.name, ...getItem(d.id) }))
    .filter(it => it.qty > 0);
  const count = totalCount();

  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">桌号 ${state.table}</p>
      <h2 style="margin-top:6px;">购物车</h2>
      ${items.length === 0
        ? `<p class="hint">购物车是空的，去菜单选几道菜吧～</p>`
        : `<ul class="order-summary">
            ${items.map(it=>`
              <li>
                <span>${it.name}<span class="spice-tag" style="margin-left:8px;">${it.spice}</span></span>
                <span class="stepper">
                  <button onclick="changeQty('${it.id}',-1)" aria-label="减少数量">−</button>
                  <span class="qty">${it.qty}</span>
                  <button onclick="changeQty('${it.id}',1)" aria-label="增加数量">+</button>
                </span>
              </li>`).join('')}
          </ul>`
      }
      <button class="ghost-btn" onclick="goBack()">返回菜单</button>
    </div>
    ${count > 0 ? `
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="submit-btn" onclick="submitOrder()" ${state.submitting?'disabled':''}>
          ${state.submitting?'下单中…':'立即下单'}
        </button>
      </div>
    </div>` : ''}`;
}

function pandaNavHTML(){
  if(!state.table) return '';
  return `
    ${state.pandaMenuOpen ? `<button class="panda-overlay" onclick="closePandaMenu()" aria-label="关闭菜单"></button>` : ''}
    <button class="my-order-btn" onclick="togglePandaMenu()" aria-label="我的小锅" aria-expanded="${state.pandaMenuOpen}">
      <span class="panda-avatar">🐼</span>
      <span class="my-order-label">我的小锅</span>
    </button>
    ${state.pandaMenuOpen ? `
      <div class="panda-dropdown">
        <button onclick="goToCart()">购物车</button>
        <button onclick="goToMyOrder()">已点菜品</button>
      </div>` : ''}`;
}

function confirmHTML(order){
  return `
    <div class="confirm-screen">
      ${backRowHTML()}
      <div class="stamp-ring"><span>${order.isAddOn ? '加单成功' : '已下单'}</span></div>
      <h2>桌号 ${order.table}</h2>
      <p class="hint">请稍候，服务员马上确认～</p>
      <button class="ghost-btn" onclick="resetToMenu()">继续点单</button>

      <div class="my-order-card">
        <p class="my-order-title">我的订单</p>
        <ul class="order-summary">
          ${order.summaryItems.map(it=>`<li>${it.name} × ${it.qty}<span class="spice-tag">${it.spice}</span></li>`).join('')}
        </ul>
        <p class="hint my-order-note">如需退菜，请联系服务员哦～</p>
        <button class="text-link-btn" onclick="resetToMenu()">继续点单 →</button>
      </div>
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'pick'){ app.innerHTML = tablePickHTML(); }
  else if(state.screen === 'confirm'){ app.innerHTML = confirmHTML(state.lastOrder); }
  else if(state.screen === 'myOrder'){ app.innerHTML = myOrderHTML(); }
  else if(state.screen === 'cart'){ app.innerHTML = cartHTML(); }
  else{ app.innerHTML = menuHTML(); }
  document.getElementById('panda-nav').innerHTML = pandaNavHTML();
}

render();
</script>
</body>
</html>
