
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>扫码点单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A120F;
    --bg-soft:#231713;
    --card:#2C1D17;
    --card-line:#4A3024;
    --ember:#E3421F;
    --ember-dark:#B22F14;
    --cinnabar:#C81E2C;
    --jade:#2F7A5E;
    --jade-dark:#245F49;
    --gold:#E8A23D;
    --gold-line:rgba(232,162,61,.4);
    --text:#F3ECE1;
    --text-muted:#AFA396;
    --radius:16px;
    --brush:'Ma Shan Zheng',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(200,30,44,.10) 0, transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(232,162,61,.08) 0, transparent 46%),
      repeating-linear-gradient(45deg, rgba(232,162,61,.025) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(200,30,44,.025) 0 2px, transparent 2px 26px);
    background-attachment:fixed;
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;position:relative;padding-bottom:110px;
    box-shadow:0 0 0 1px rgba(232,162,61,.06);
  }
  #app::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--cinnabar),var(--gold) 50%,var(--cinnabar));
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--gold);
    text-transform:uppercase;font-weight:700;
  }
  /* ---------- table picker (test mode) ---------- */
  .pick-screen{padding:64px 24px;text-align:center;}
  .pick-screen h1{
    font-family:var(--brush);
    font-weight:400;
    font-size:44px;margin:10px 0 6px;color:var(--text);
    text-shadow:0 0 18px rgba(200,30,44,.45);
  }
  .pick-hint{color:var(--text-muted);font-size:14px;margin-bottom:32px;}
  .table-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .table-grid button{
    aspect-ratio:1;border-radius:14px;border:1px solid var(--card-line);
    background:var(--card);color:var(--text);font-size:20px;font-weight:700;
    font-family:'Archivo Black',sans-serif;cursor:pointer;
  }
  .table-grid button:hover{border-color:var(--gold);color:var(--gold);}
  .table-grid button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- header ---------- */
  header.bar{
    padding:28px 24px 18px;border-bottom:1px solid var(--card-line);
    position:relative;overflow:hidden;
  }
  header.bar::after{
    content:"";position:absolute;top:-30px;right:-30px;width:130px;height:130px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>");
    background-size:contain;background-repeat:no-repeat;opacity:.14;pointer-events:none;
  }
  .table-badge{display:flex;flex-direction:column;align-items:flex-start;gap:4px;position:relative;}
  .table-badge .num{
    font-family:'Archivo Black',sans-serif;
    font-size:36px;color:var(--ember);line-height:1;
    text-shadow:0 0 22px rgba(227,66,31,.5);
  }
  .change-table{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;
    margin-top:6px;
  }
  .change-table:hover{color:var(--gold);border-color:var(--gold-line);}

  /* ---------- panda nav (fixed, shown on every screen once a table is known) ---------- */
  #panda-nav{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;}
  .panda-overlay{position:fixed;inset:0;z-index:55;background:none;border:none;padding:0;margin:0;cursor:default;}
  .my-order-btn{
    position:relative;z-index:56;
    display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
    padding:0;font-family:inherit;color:var(--text);
  }
  .panda-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:var(--card);border:1.5px solid var(--gold-line);
    display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;
    box-shadow:0 0 0 3px rgba(232,162,61,.08);
  }
  .my-order-btn:hover .panda-avatar{border-color:var(--gold);}
  .my-order-label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .my-order-btn:hover .my-order-label{color:var(--gold);}
  .panda-dropdown{
    position:relative;z-index:56;margin-top:8px;min-width:136px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:12px;
    overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .panda-dropdown button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:13.5px;font-weight:700;padding:12px 16px;cursor:pointer;font-family:inherit;
  }
  .panda-dropdown button+button{border-top:1px solid var(--card-line);}
  .panda-dropdown button:hover{background:var(--bg-soft);color:var(--cinnabar);}

  /* ---------- menu ---------- */
  .menu-title{
    padding:20px 24px 8px;font-size:26px;font-weight:400;color:var(--gold);
    font-family:var(--brush);letter-spacing:.04em;
  }
  .menu-body{display:flex;align-items:flex-start;}
  .category-nav{
    width:84px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--card-line);
  }
  .cat-btn{
    position:relative;
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;padding:14px 6px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.3;
  }
  .cat-btn::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;
    background:linear-gradient(180deg,var(--cinnabar),var(--gold));opacity:0;transition:opacity .15s;
  }
  .cat-btn.active{color:var(--text);background:var(--bg-soft);}
  .cat-btn.active::before{opacity:1;}
  .cat-btn:hover{color:var(--text);}
  .dish-panel{flex:1;min-width:0;padding-right:16px;}
  .dish-list{padding:0 0 0 16px;display:flex;flex-direction:column;gap:14px;}
  .dish-card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:18px 18px 16px 21px;
  }
  .dish-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--cinnabar),var(--gold));
  }
  .dish-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .dish-head h3{
    font-size:20px;font-weight:900;letter-spacing:.02em;
  }
  .dish-head .tag{font-size:12.5px;color:var(--text-muted);margin-top:5px;}
  .stepper{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .stepper button{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper button:not(:disabled):hover{border-color:var(--ember);color:var(--ember);}
  .stepper .qty{
    width:30px;text-align:center;font-weight:700;font-size:16px;
    font-family:'Archivo Black',sans-serif;
  }
  .spice-row{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--card-line);}
  .spice-pill{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 6px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:12.5px;cursor:pointer;
  }
  .spice-pill.active{border-color:var(--cinnabar);color:var(--gold);background:rgba(200,30,44,.16);}
  .flame{fill:var(--card-line);}
  .spice-pill.active .flame.lit{fill:var(--cinnabar);}
  .spice-pill:not(.active) .flame.lit{fill:var(--text-muted);}

  /* ---------- sticky bottom bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
    background:linear-gradient(180deg,rgba(27,22,19,0) 0%,var(--bg) 30%);
    padding:20px 16px 24px;
  }
  .bottom-bar-inner{
    width:100%;max-width:448px;display:flex;align-items:stretch;gap:12px;
  }
  .submit-btn{
    flex:1;background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    color:#fff;border:1px solid var(--gold-line);border-radius:14px;
    padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    box-shadow:0 6px 18px rgba(178,47,20,.35);
  }
  .submit-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .submit-btn:not(:disabled):active{background:var(--ember-dark);}

  .cart-btn{
    flex:1;background:linear-gradient(160deg,var(--jade) 0%,var(--jade-dark) 100%);
    color:#fff;border:1px solid var(--gold-line);border-radius:14px;
    padding:12px 14px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-align:center;
    box-shadow:0 6px 18px rgba(36,95,73,.35);
  }
  .cart-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .cart-btn:not(:disabled):active{background:var(--jade-dark);}
  .cart-btn-title{font-size:23px;font-weight:900;}
  .cart-btn-sub{font-size:11.5px;font-weight:500;opacity:.85;}

  .order-now-btn{
    width:92px;aspect-ratio:1;flex-shrink:0;
    background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    color:#fff;border:1px solid var(--gold-line);
    border-radius:14px;cursor:pointer;font-family:inherit;padding:0 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;
    box-shadow:0 6px 18px rgba(178,47,20,.35);
  }
  .order-now-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .order-now-btn:not(:disabled):active{background:var(--ember-dark);}
  .order-now-title{font-size:17px;font-weight:900;}
  .order-now-sub{font-size:9.5px;font-weight:500;opacity:.85;}

  /* ---------- add-to-cart dumpling/hotpot animation ---------- */
  .hotpot-toast{
    position:fixed;left:50%;bottom:148px;z-index:80;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    animation:hotpot-toast-life 1.7s ease forwards;
  }
  @keyframes hotpot-toast-life{
    0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9);}
    10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    82%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96);}
  }
  .hotpot-pot{position:relative;width:112px;height:84px;}
  .hotpot-pot svg{position:absolute;left:0;top:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
  .hotpot-dumpling{
    position:absolute;left:50%;top:50%;font-size:26px;line-height:1;
    transform:translate(-50%,-120px) rotate(-25deg);
    animation:dumpling-drop .55s cubic-bezier(.55,0,.85,.6) .3s forwards;
  }
  @keyframes dumpling-drop{
    0%{transform:translate(-50%,-120px) rotate(-25deg);opacity:1;}
    85%{transform:translate(-50%,-14px) rotate(20deg);opacity:1;}
    100%{transform:translate(-50%,-10px) rotate(15deg) scale(.92);opacity:1;}
  }
  .hotpot-splash{
    position:absolute;left:50%;top:36%;font-size:20px;
    transform:translate(-50%,-50%) scale(.2);opacity:0;
    animation:hotpot-splash .45s ease-out .82s forwards;
  }
  @keyframes hotpot-splash{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
    35%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}
    100%{transform:translate(-50%,-60%) scale(1.6);opacity:0;}
  }
  .hotpot-steam{
    position:absolute;color:rgba(255,255,255,.55);font-size:16px;font-weight:700;opacity:0;
    animation:hotpot-steam-rise 1.6s ease-in-out infinite;
  }
  .hotpot-steam.s1{left:36%;top:4px;animation-delay:0s;}
  .hotpot-steam.s2{left:58%;top:0;animation-delay:.5s;}
  @keyframes hotpot-steam-rise{
    0%{opacity:0;transform:translateY(4px) scale(.8);}
    30%{opacity:.8;}
    100%{opacity:0;transform:translateY(-22px) scale(1.15);}
  }
  .hotpot-caption{
    background:var(--card);border:1px solid var(--card-line);color:var(--text);
    font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:20px;
    opacity:0;animation:hotpot-caption-in .4s ease .9s forwards;
  }
  @keyframes hotpot-caption-in{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* ---------- confirm screen ---------- */
  .confirm-screen{padding:56px 28px 40px;text-align:center;}
  .stamp-ring{
    width:132px;height:132px;margin:0 auto 26px;border-radius:50%;
    border:3px solid var(--cinnabar);display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);position:relative;
    box-shadow:0 0 0 1px rgba(200,30,44,.15), 0 0 26px rgba(200,30,44,.35);
  }
  .stamp-ring::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--cinnabar);border-radius:50%;
  }
  .stamp-ring span{
    font-family:'Archivo Black',sans-serif;color:var(--cinnabar);font-size:19px;letter-spacing:.05em;
  }
  @media (prefers-reduced-motion:no-preference){
    .stamp-ring{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  }
  @keyframes pop{from{transform:rotate(-8deg) scale(.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .confirm-screen h2{
    font-family:var(--brush);font-weight:400;font-size:34px;color:var(--gold);margin-bottom:22px;
  }
  .order-summary{list-style:none;text-align:left;background:var(--card);border:1px solid var(--card-line);
    border-top:1px solid var(--gold-line);
    border-radius:var(--radius);padding:6px 18px;margin-bottom:20px;}
  .order-summary li{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;font-size:15px;
  }
  .order-summary li + li{border-top:1px dashed var(--card-line);}
  .spice-tag{font-size:11.5px;color:var(--gold);border:1px solid var(--gold-line);border-radius:20px;padding:2px 9px;}
  .hint{color:var(--text-muted);font-size:13.5px;margin-bottom:26px;}
  .ghost-btn{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    padding:11px 22px;border-radius:12px;font-size:14px;cursor:pointer;
  }
  .ghost-btn:hover{color:var(--gold);border-color:var(--gold-line);}

  .back-row{text-align:left;padding:14px 24px 0;}
  .back-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;cursor:pointer;padding:6px 2px;
    font-family:inherit;
  }
  .back-btn:hover{color:var(--gold);}

  .my-order-card{
    margin-top:32px;text-align:left;
    background:var(--card);border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .my-order-title{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);}
  .my-order-card .order-summary{
    margin:12px 0 0;background:none;border:none;padding:0;
  }
  .my-order-card .order-summary li{padding:11px 0;}
  .my-order-card .order-summary li + li{border-top:1px dashed var(--card-line);}
  .my-order-note{font-size:12.5px;color:var(--gold);margin:14px 0 0;}
  .text-link-btn{
    background:none;border:none;color:var(--cinnabar);font-weight:700;font-size:14px;
    cursor:pointer;padding:14px 0 0;font-family:inherit;display:block;
  }
  .text-link-btn:hover{text-decoration:underline;}

  /* ---------- welcome / language select ---------- */
  .welcome-screen{
    --wgold-hi:#F7E3A1;--wgold-mid:#D8AE55;--wgold-deep:#8A5A18;--wgold-line:rgba(216,174,85,.55);
    --wcream:#F3E6C8;
    position:relative;overflow:hidden;
    min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
    padding:10vh 24px;
    background:#7A1414 url("../image/background/back.webp") center/cover no-repeat;
  }
  .welcome-inner{
    position:relative;z-index:1;
    text-align:center;width:100%;max-width:380px;
    display:flex;flex-direction:column;align-items:center;
  }

  .welcome-leaf{
    width:150px;
    opacity:0;transform:translateY(10px) scale(.86);
    transition:opacity 1.1s cubic-bezier(.16,.9,.28,1), transform 1.1s cubic-bezier(.16,.9,.28,1);
  }
  .welcome-leaf.in{opacity:1;transform:translateY(0) scale(1);}
  .welcome-leaf img{
    display:block;width:100%;height:auto;
  }

  .welcome-word{
    margin:24px 0 0;min-height:1.3em;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-family:'Cormorant Garamond','Songti SC','Noto Serif SC',serif;
    font-weight:500;font-size:clamp(26px,6.4vw,32px);
    letter-spacing:.02em;color:var(--wcream);
    text-shadow:0 1px 10px rgba(0,0,0,.3);
  }
  .welcome-word.in{opacity:1;transform:translateY(0);}
  .welcome-word.swap{opacity:0;transform:translateY(6px);transition:opacity .38s ease, transform .38s ease;}

  .welcome-divider{
    width:0%;height:1px;margin:22px 0 20px;
    background:linear-gradient(90deg, transparent, var(--wgold-line) 50%, transparent);
    transition:width 1s ease;
  }
  .welcome-divider.in{width:64%;}

  .welcome-wordmark{
    opacity:0;transform:translateY(14px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
  }
  .welcome-wordmark.in{opacity:1;transform:translateY(0);}
  .welcome-wordmark h1{
    margin:0;
    font-family:'Cormorant Garamond',Georgia,'Songti SC',serif;
    font-weight:500;font-size:clamp(30px,7.6vw,40px);
    letter-spacing:.14em;text-transform:uppercase;line-height:1.15;
    background:linear-gradient(180deg, var(--wgold-hi) 0%, var(--wgold-mid) 48%, var(--wgold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    color:var(--wgold-mid);
    text-shadow:0 1px 0 rgba(0,0,0,.18);
  }

  .welcome-kicker{
    margin-top:16px;
    opacity:0;transform:translateY(8px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--wgold-line);
  }
  .welcome-kicker.in{opacity:1;transform:translateY(0);}

  .welcome-btn-wrap{
    margin-top:38px;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    position:relative;
  }
  .welcome-btn-wrap.in{opacity:1;transform:translateY(0);}
  .lang-select-btn{
    position:relative;z-index:56;
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(160deg, rgba(216,174,85,.16), rgba(216,174,85,.05));
    border:1px solid var(--wgold-line);color:var(--wcream);
    padding:13px 26px;border-radius:999px;font-size:13px;font-weight:700;
    letter-spacing:.05em;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 22px rgba(20,2,2,.4);
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
  }

function t(key){
  const dict = I18N[state.lang] || I18N.zh;
  return dict[key] !== undefined ? dict[key] : I18N.zh[key];
}
function tCat(catId){ return (I18N[state.lang] || I18N.zh).categories[catId]; }
function tSpice(idx){ return (I18N[state.lang] || I18N.zh).spice[idx]; }
function tDish(id, field){ return (I18N[state.lang] || I18N.zh).dishes[id][field]; }
function displayDishName(zhName){
  const dish = MENU.find(d => d.name === zhName);
  return dish ? tDish(dish.id, 'name') : zhName;
}
function displaySpice(zhSpice){
  const idx = SPICE_LEVELS.indexOf(zhSpice);
  return idx >= 0 ? tSpice(idx) : zhSpice;
}

  { id:'dachang', name:'爆炒大肠', category:'signature' },

const SPICE_LEVELS = ['微辣','中辣','特辣'];

};

let screenHistory = [];   // 记录来源页面，供“返回”按钮回退用
let welcomeTimer = null;

function applyLanguage(code){
  state.lang = code;
  document.documentElement.lang = code;
  document.title = t('appTitle');
}

function selectLanguage(code){
  applyLanguage(code);
  state.langMenuOpen = false;
  state.welcomeVisible = false;
  stopWelcomeCycle();
  screenHistory = [];
  state.screen = state.table ? 'menu' : 'pick';
  render();
}

function setLanguage(code){
  applyLanguage(code);
  state.langSwitcherOpen = false;
  state.pandaMenuOpen = false;
  render();
}

function toggleWelcomeLangMenu(){
  state.langMenuOpen = !state.langMenuOpen;
  render();
}

function toggleLangSwitcher(){
  state.pandaMenuOpen = false;
  state.langSwitcherOpen = !state.langSwitcherOpen;
  render();
}

function closeLangSwitcher(){
  state.langSwitcherOpen = false;
  render();
}

function stopWelcomeCycle(){
  if(welcomeTimer){ clearInterval(welcomeTimer); welcomeTimer = null; }
}

function startWelcomeCycle(){
  if(welcomeTimer) return;
  let idx = 0;
  welcomeTimer = setInterval(()=>{
    const el = document.getElementById('welcome-word');
    if(!el) return;
    el.classList.add('swap');
    setTimeout(()=>{
      idx = (idx + 1) % LANG_ORDER.length;
      el.textContent = LANG_META[LANG_ORDER[idx]].greeting;
      el.classList.remove('swap');
    }, 400);
  }, 1800);
}

const WELCOME_INTRO = [
  { id:'welcome-leaf',     delay:100 },
  { id:'welcome-word',     delay:500 },
  { id:'welcome-divider',  delay:1150 },
  { id:'welcome-wordmark', delay:1350 },
  { id:'welcome-kicker',   delay:1600 },
  { id:'welcome-btn-wrap', delay:1850 },
];

function mountWelcomeScreen(){
  if(!state.welcomeVisible){
    WELCOME_INTRO.forEach((item, i)=>{
      setTimeout(()=>{
        const el = document.getElementById(item.id);
        if(el) el.classList.add('in');
        if(i === WELCOME_INTRO.length - 1) state.welcomeVisible = true;
      }, item.delay);
    });
    setTimeout(startWelcomeCycle, 1500);
  }else{
    startWelcomeCycle();
  }
}

  return `
    <div class="lang-panel">
      ${LANG_ORDER.map(code => `
        <button class="${state.lang===code?'active':''}" onclick="${handlerName}('${code}')">
          <span class="lang-native">${LANG_META[code].native}</span>
          <span class="lang-check">✓</span>
        </button>`).join('')}
    </div>`;
}

      </div>

}

  const prev = screenHistory.pop();
  if(!prev) return;
  state.screen = prev;
  render();
}

function backRowHTML(){
  if(screenHistory.length === 0) return '';
  return `<div class="back-row"><button class="back-btn" onclick="goBack()" aria-label="${t('back')}">← ${t('back')}</button></div>`;
}

function getItem(id){
  return state.items[id] || { qty:0, spice:'中辣' };
}

function changeQty(id, delta){
  const cur = getItem(id);
  const qty = Math.max(0, Math.min(20, cur.qty + delta));
  state.items[id] = { qty, spice: cur.spice };
  render();
}

function setSpice(id, level){
  const cur = getItem(id);
  if(cur.qty <= 0) return;
  state.items[id] = { qty: cur.qty, spice: level };
  render();
}

function setCategory(cat){
  state.activeCategory = cat;
  render();
}

  state.pandaMenuOpen = false;
  if(state.screen !== 'myOrder') screenHistory.push(state.screen);
  state.screen = 'myOrder';
  state.myOrderLoading = true;
  state.myOrderItems = null;
  render();

  const orders = await fetchTableOrders(state.table);
  state.myOrderItems = mergeItems(orders);
  state.myOrderLoading = false;
  render();
}

  if(!state.pandaMenuOpen) return;

  render();

function selectTable(n){
  screenHistory.push(state.screen);
  state.table = String(n);
  state.screen = 'menu';
  render();
}

function changeTable(){
  if(state.lockedByUrl) return;
  screenHistory = [];
  state.screen = 'pick';
  render();
}

function totalCount(){
  return Object.values(state.items).reduce((s,v)=>s+v.qty,0);
}

function resetToMenu(){
  state.items = {};
  state.lastOrder = null;
  screenHistory = [];
  state.screen = 'menu';
  render();
}

async function fetchTableOrders(table){
  try{
    const snap = await ordersRef.where('table', '==', String(table)).get();
    return snap.docs.map(d => d.data());
  }catch(e){ return []; }
}

// 同一桌可能有多笔未处理订单（加菜），按“菜名+辣度”合并数量，方便顾客看到本桌目前的点单全貌
function mergeItems(ordersList){
  const merged = new Map();
  ordersList.forEach(o => {
    o.items.forEach(it => {
      const key = it.name + '__' + it.spice;
      if(!merged.has(key)) merged.set(key, { name: it.name, spice: it.spice, qty: 0 });
      merged.get(key).qty += it.qty;
    });
  });
  return Array.from(merged.values());
}

async function submitOrder(){
  if(state.submitting || totalCount() === 0) return;
  state.submitting = true; render();

  const items = MENU
    .map(d => ({ name: d.name, ...getItem(d.id) }))
    .filter(it => it.qty > 0)
    .map(it => ({ name: it.name, qty: it.qty, spice: it.spice }));

  const order = { table: state.table, items, createdAt: Date.now() };

  try{
    const priorOrders = await fetchTableOrders(state.table);
    const isAddOn = priorOrders.length > 0;

    await ordersRef.add({
      table: order.table,
      items: order.items,
      createdAt: order.createdAt,
    });

    const tableOrders = await fetchTableOrders(state.table);
    const summaryItems = mergeItems(tableOrders.length > 0 ? tableOrders : [...priorOrders, order]);

    state.lastOrder = { table: order.table, items: order.items, summaryItems, isAddOn };
    screenHistory.push('menu');
    state.screen = 'confirm';
  }catch(e){
    alert(t('orderFailed'));
  }
  state.submitting = false;
  render();
}

function flameIcons(n){
  let out = '';
  for(let i=0;i<3;i++){
    out += `<svg class="flame ${i<n?'lit':''}" viewBox="0 0 24 24" width="11" height="11">
      <path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-5 5-9z"/>
    </svg>`;
  }
  return out;
}

const PICKABLE_TABLES = [...Array.from({length:30},(_,i)=>i+1), 888];

function tablePickHTML(){
  return `
    <div class="pick-screen">
      <p class="eyebrow">${t('pickEyebrow')}</p>
      <h1>${t('pickTitle')}</h1>
      <p class="pick-hint">${t('pickHint')}</p>
      <div class="table-grid">
        ${PICKABLE_TABLES.map(n=>`<button onclick="selectTable(${n})">${t('tablePrefix')}${n}</button>`).join('')}
      </div>
    </div>`;
}

function menuHTML(){
  const activeCat = state.activeCategory || 'all';
  const filteredMenu = activeCat === 'all' ? MENU : MENU.filter(d=>d.category===activeCat);

  const dishesHTML = filteredMenu.map(d=>{
    const it = getItem(d.id);
    return `
      <div class="dish-card">
        <div class="dish-head">
          <div>
            <h3>${tDish(d.id,'name')}</h3>
            <p class="tag">${tDish(d.id,'tag')}</p>
          </div>
          <div class="stepper">
            <button onclick="changeQty('${d.id}',-1)" ${it.qty<=0?'disabled':''} aria-label="${t('decreaseQty')}">−</button>
            <span class="qty">${it.qty}</span>
            <button onclick="changeQty('${d.id}',1)" aria-label="${t('increaseQty')}">+</button>
          </div>
        </div>
        ${it.qty>0 ? `
          <div class="spice-row">
            ${SPICE_LEVELS.map((lvl,i)=>`
              <button class="spice-pill ${it.spice===lvl?'active':''}" onclick="setSpice('${d.id}','${lvl}')">
                ${flameIcons(i+1)}<span>${tSpice(i)}</span>
              </button>`).join('')}
          </div>` : ''}
      </div>`;
  }).join('');

  const categoryNavHTML = CATEGORIES.map(cat=>`
    <button class="cat-btn ${activeCat===cat?'active':''}" onclick="setCategory('${cat}')">${tCat(cat)}</button>
  `).join('');

  const count = totalCount();

  return `
    ${backRowHTML()}
    <header class="bar">
      <div class="table-badge">
        <span class="eyebrow">${t('tableEyebrow')}</span>
        <span class="num">${state.table}</span>
        ${!state.lockedByUrl ? `<button class="change-table" onclick="changeTable()">${t('changeTable')}</button>` : ''}
      </div>
    </header>
    <p class="menu-title">${t('menuTitle')}</p>
    <div class="menu-body">
      <nav class="category-nav">${categoryNavHTML}</nav>
      <div class="dish-panel">
        <div class="dish-list">${dishesHTML}</div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="cart-btn" onclick="celebrateAddToCart()" ${count===0?'disabled':''}>
          <span class="cart-btn-title">${t('addToCart')}</span>
          <span class="cart-btn-sub">${t('addToCartSub')}</span>
        </button>
        <button class="order-now-btn" onclick="submitOrder()" ${count===0||state.submitting?'disabled':''}>
          <span class="order-now-title">${state.submitting?t('ordering'):t('orderNow')}</span>
          <span class="order-now-sub">${t('orderNowSub')}</span>
        </button>
      </div>
    </div>`;
}

function myOrderHTML(){
  const items = state.myOrderItems || [];
  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">${t('tableEyebrow')} ${state.table}</p>
      <h2 style="margin-top:6px;">${t('myOrder')}</h2>
      ${state.myOrderLoading
        ? `<p class="hint">${t('loading')}</p>`
        : items.length === 0
          ? `<p class="hint">${t('noOrderYet')}</p>`
          : `<ul class="order-summary">
              ${items.map(it=>`<li>${displayDishName(it.name)} × ${it.qty}<span class="spice-tag">${displaySpice(it.spice)}</span></li>`).join('')}
            </ul>
            <p class="hint">${t('removeHint')}</p>`
      }
      <button class="ghost-btn" onclick="goBack()">${t('backToMenu')}</button>
    </div>`;
}

function cartHTML(){
  const items = MENU
    .map(d => ({ id: d.id, name: tDish(d.id,'name'), ...getItem(d.id) }))
    .filter(it => it.qty > 0);
  const count = totalCount();

  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">${t('tableEyebrow')} ${state.table}</p>
      <h2 style="margin-top:6px;">${t('cart')}</h2>
      ${items.length === 0
        ? `<p class="hint">${t('emptyCart')}</p>`
        : `<ul class="order-summary">
            ${items.map(it=>`
              <li>
                <span>${it.name}<span class="spice-tag" style="margin-left:8px;">${displaySpice(it.spice)}</span></span>
                <span class="stepper">
                  <button onclick="changeQty('${it.id}',-1)" aria-label="${t('decreaseQty')}">−</button>
                  <span class="qty">${it.qty}</span>
                  <button onclick="changeQty('${it.id}',1)" aria-label="${t('increaseQty')}">+</button>
                </span>
              </li>`).join('')}
          </ul>`
      }
      <button class="ghost-btn" onclick="goBack()">${t('backToMenu')}</button>
    </div>
    ${count > 0 ? `
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="submit-btn" onclick="submitOrder()" ${state.submitting?'disabled':''}>
          ${state.submitting?t('ordering'):t('orderNow')}
        </button>
      </div>
    </div>` : ''}`;
}

function pandaNavHTML(){
  if(!state.table) return '';
  return `
    ${state.pandaMenuOpen ? `<button class="panda-overlay" onclick="closePandaMenu()" aria-label="${t('closeMenu')}"></button>` : ''}
    <button class="my-order-btn" onclick="togglePandaMenu()" aria-label="${t('myPot')}" aria-expanded="${state.pandaMenuOpen}">
      <span class="panda-avatar">🐼</span>
      <span class="my-order-label">${t('myPot')}</span>
    </button>
    ${state.pandaMenuOpen ? `
      <div class="panda-dropdown">
        <button onclick="goToCart()">${t('cart')}</button>
        <button onclick="goToMyOrder()">${t('orderedItems')}</button>
        <button onclick="toggleLangSwitcher()">🌐 ${LANG_META[state.lang].native}</button>
      </div>` : ''}`;
}

function confirmHTML(order){
  return `
    <div class="confirm-screen">
      ${backRowHTML()}
      <div class="stamp-ring"><span>${order.isAddOn ? t('addOnSuccess') : t('orderPlaced')}</span></div>
      <h2>${t('tableEyebrow')} ${order.table}</h2>
      <p class="hint">${t('waitConfirm')}</p>
      <button class="ghost-btn" onclick="resetToMenu()">${t('continueOrdering')}</button>

      <div class="my-order-card">
        <p class="my-order-title">${t('myOrder')}</p>
        <ul class="order-summary">
          ${order.summaryItems.map(it=>`<li>${displayDishName(it.name)} × ${it.qty}<span class="spice-tag">${displaySpice(it.spice)}</span></li>`).join('')}
        </ul>
        <p class="hint my-order-note">${t('removeHint')}</p>
        <button class="text-link-btn" onclick="resetToMenu()">${t('continueOrdering')} →</button>
      </div>
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  let screenHtml;
  if(state.screen === 'welcome'){ screenHtml = welcomeHTML(); }
  else if(state.screen === 'pick'){ screenHtml = tablePickHTML(); }
  else if(state.screen === 'confirm'){ screenHtml = confirmHTML(state.lastOrder); }
  else if(state.screen === 'myOrder'){ screenHtml = myOrderHTML(); }
  else if(state.screen === 'cart'){ screenHtml = cartHTML(); }
  else{ screenHtml = menuHTML(); }

  const overlayHtml = state.langSwitcherOpen ? `
    <button class="lang-switcher-overlay" onclick="closeLangSwitcher()" aria-label="${t('closeMenu')}"></button>
    <div class="lang-switcher-panel">
      <p class="lang-switcher-title">${t('languageLabel')}</p>
      ${langPanelHTML('setLanguage')}
    </div>` : '';

  app.innerHTML = screenHtml + overlayHtml;
  document.getElementById('panda-nav').innerHTML = state.screen === 'welcome' ? '' : pandaNavHTML();

  if(state.screen === 'welcome'){ mountWelcomeScreen(); }
  else{ stopWelcomeCycle(); }
}

render();
</script>
</body>
</html>
